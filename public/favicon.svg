<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1" />

  <!-- Radar/Network Signal Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#2dd4bf" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Network Nodes & Connecting Lines -->
  <!-- Top Left Node -->
  <line x1="32" y1="32" x2="18" y2="18" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
  <circle cx="18" cy="18" r="3.5" fill="#2dd4bf" filter="url(#glow)" />

  <!-- Top Right Node -->
  <line x1="32" y1="32" x2="46" y2="18" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
  <circle cx="46" cy="18" r="3.5" fill="#c026d3" filter="url(#glow)" />

  <!-- Bottom Node -->
  <line x1="32" y1="32" x2="32" y2="48" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="48" r="3" fill="#14b8a6" />

  <!-- Pulse Waveform Line Overlay through center -->
  <path d="M 12 32 L 22 32 L 26 24 L 30 40 L 34 20 L 38 36 L 42 32 L 52 32" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Central Core Node -->
  <circle cx="32" cy="32" r="5" fill="url(#tealGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
</svg>
