<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var target = window;
          var prop = 'fetch';
          var currentFetch = target[prop];
          Object.defineProperty(target, prop, {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("[Sandbox Patch] Failed to redefine fetch property:", e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Net Observer — real-time network packet capture and analysis dashboard" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Net Observer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
